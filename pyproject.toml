[project]
name = "shopfloor_tablet"
authors = [
    { name = "Shopfloor Tablet", email = "info@example.com"}
]
description = "Simple tablet screen for workers to record start/finish time, good and scrap quantity on ERPNext Job Cards"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
